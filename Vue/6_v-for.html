<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="app">
        <ul>
            <!-- v-for循环渲染列表 -->
            <!-- v-for必须添加key属性,绑定唯一值,避免重复 -->
            <li v-for="(item,index) in list" :key="index">{{index}}------{{item}}</li>
        </ul>

        <ul>
            <li v-for="(item,index) in obj" :key="index">{{index}}------{{item}}</li>
        </ul>

        <ul>
            <li v-for="item in arr" :key="item.name">{{item.name}}------{{item.age}}</li>
        </ul>
    </div>
    <script src="vue.js"></script>
    <script>
        new Vue({
            el: "#app",
            data: {
                list: [
                    "张三",
                    "李四",
                    "王五",
                    "赵六"
                ],
                obj: {
                    name: "张三",
                    age: 18,
                    gender: "男",
                    phone: "123456789"
                },
                arr: [
                    {
                        name: "张三",
                        age: 18,
                    },
                    {
                        name: "李四",
                        age: 19,
                    },
                    {
                        name: "王五",
                        age: 20,
                    }
                ]
            }
        })
    </script>
</body>

</html>
