<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <!-- 使用组件 -->
        <box></box>
    </div>
    <script src="./js/vue.js"></script>
    <script>
        new Vue({
            el: '#app',
            // 定义组件
            components:{
                // 定义一个组件，组件的名称是box
                "box":{
                    // 组件的模板 组件的内容html部分
                    template: '<div>这是一个组件</div>'
                }
            }
        })
    </script>
</body>
</html>
