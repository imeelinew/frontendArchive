<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>商品卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
        }

        .item-card {
            padding: 20px;
            width: 270px;
            /* height: 300px; */
            /* text-align: center; */
            border: 1px solid black;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.344);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 10px;
        }

        img {
            width: 200px;
        }

        .prod-name {
            font-weight: bold;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .brief .price {
            text-align: left;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <div class="item-card" v-for="item in productList">
                <img :src="item.pic" alt="">
                <div class="prod-name">{{item.prodName}}</div>
                <div class="biref">{{item.brief}}</div>
                <div class="price">¥{{item.price}}</div>
            </div>
        </div>
    </div>

    <script src="vue.js"></script>
    <script src="ajax.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                productList: []
            },
            mounted() {
                ajax('GET', 'http://shop-api.edu.koobietech.com/prod/tagProdList', (res) => {
                    let result = JSON.parse(res);
                    this.productList = result.data[0].productDtoList;
                })
            }
        })
    </script>
</body>

</html>
