<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="app">
        <!-- 使用组件 -->
        <box></box>

    </div>
    <!-- 定义组件模板 -->
    <template id="box-temp">
        <!-- 组件的模板 组件的内容html部分 -->
         <!-- 组件模板中只能有一个根元素 只能有一个最外层的容器 -->
        <div>
            <div>这是一个组件</div>
            <h1>这是一个组件的h1标题</h1>
        </div>
    </template>
    <script src="./js/vue.js"></script>
    <script>
        new Vue({
            el: '#app',
            // 定义组件
            components: {
                // 定义一个组件，组件的名称是box
                "box": {
                    // 引入模板
                    template: '#box-temp'
                }
            }
        })
    </script>
</body>

</html>
