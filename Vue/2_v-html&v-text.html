<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <div v-text="str"></div>
        <div v-html="str2"></div>
        <!-- 功能类似于innerText and innerHTML -->
    </div>
    <script src="vue.js"></script>
    <script>
        new Vue({
            el:"#app",
            data:{
                str:"v-text",
                str2:"<h1>v-html</h1>"
            }
        })
    </script>
</body>
</html>
