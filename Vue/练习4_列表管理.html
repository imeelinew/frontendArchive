<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #app {
            width: 1300px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="bg-primary text-white p-3">
            <h3>商品列表管理</h3>
        </div>
        <div class="input-group mb-3" style="width: 200px; margin-top: 20px;">
            <input v-model="keyword" type="text" class="form-control" placeholder="请输入搜索名称">
            <button class="btn btn-primary">搜索</button>
        </div>
        <div class="mb-3">
            <input v-model="newName" type="text" class="form-control d-inline-block" placeholder="商品名称"
                style="width: 200px;">
            <input v-model="newPrice" type="number" class="form-control d-inline-block" placeholder="商品价格"
                style="width: 200px;">
            <button @click="addGoods" class="btn btn-outline-primary">添加商品</button>
        </div>
        <table class="table table-striped">
            <thead>
                <tr style="border-bottom: 3px solid #000000;">
                    <th>序号</th>
                    <th>状态</th>
                    <th>商品名称</th>
                    <th>商品价格</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(item,index) in dataList" :key="item.id" v-show="item.name.includes(keyword)"
                    @click="item.isCheck = !item.isCheck" :class="{ 'table-primary': item.isCheck }"
                    style="cursor: pointer;">
                    <td>{{index+1}}</td>
                    <td>
                        <input type="checkbox" v-model="item.isCheck">
                    </td>
                    <td>{{item.name}}</td>
                    <td>{{item.price}}</td>
                    <td>
                        <button @click="dropGoods(index)" type="button" class="btn btn-danger">删除</button>
                    </td>
                </tr>
                <tr>
                    <td>总价</td>
                    <td></td>
                    <td></td>
                    <td>0</td>
                    <td>
                        <button @click="deleteChecked" type="button" class="btn btn-danger">删除选中</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="vue.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                dataList: [
                    {
                        id: 1001,
                        name: "衣服",
                        price: 100,
                        isCheck: false
                    },
                    {
                        id: 1002,
                        name: "裤子",
                        price: 200,
                        isCheck: false
                    },
                    {
                        id: 1003,
                        name: "帽子",
                        price: 50,
                        isCheck: false
                    },
                    {
                        id: 1004,
                        name: "鞋",
                        price: 300,
                        isCheck: false
                    }
                ],
                keyword: "",
                newName: "",
                newPrice: ""
            },
            methods: {
                addGoods() {
                    const newItem = {
                        id: this.dataList.length + 1,
                        name: this.newName,
                        price: this.newPrice,
                        isCheck: false
                    }
                    this.dataList.push(newItem)
                    this.newName = "";
                    this.newPrice = "";
                },
                dropGoods(index) {
                    this.dataList.splice(index, 1);
                },
                deleteChecked() {
                    this.dataList = this.dataList.filter(item => !item.isCheck);
                }
            }
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
