<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 style="font-weight: 100; margin-top: 20px;">Todo List</h1>
        <section class="actions">
            <input type="text" class="todo-input" placeholder="请输入Todo内容">
            <button class="add-btn">+</button>
        </section>
        <section class="info">
            总数: <span class="total-count">0</span>
            已完成: <span class="done-count">0</span>
            <button class="clear-done-btn">清空已完成</button>
        </section>
        <section class="list">
            <ul class="todo-list"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
