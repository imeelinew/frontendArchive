<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        let obj = {
            name: "zhangsan",
            fn2: fn2 = (x, y) => {
                const sum = x * y
                console.log(sum, 'sum')
            }
        }

        function fn1(x, y) {
            const sum = x + y;
            console.log(sum, 'sum')
        }

        fn1(2, 3)
        fn2.call(obj, 2, 3)
        fn2.apply(obj, [2, 3])
        fn2.bind(obj, 2, 3)();
    </script>
</body>

</html>
