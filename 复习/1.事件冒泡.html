<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #box{
        width: 400px;
        height: 400px;
        background: blue;
    }
    #box1{
        width: 200px;
        height: 200px;
        background: red;
    }
</style>
<body>
    <div id="box">
        <div id="box1"></div>
    </div>

    <script>
        let box = document.getElementById("box");
        let box1 = document.getElementById("box1");

        box.addEventListener("click",function () {
           console.log("1") 
        },true)
        box1.addEventListener("click",function () {
           console.log("2") 
        },true)
    </script>
</body>
</html>
